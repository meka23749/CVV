<!DOCTYPE html>
<html lang="de">
<head>
  <title>Steve Meka · Embedded Software Engineer</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="http://fonts.googleapis.com/css?family=Lato&subset=latin,latin-ext" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">

  <style>
    :root{
      --bg:#0b0f19;
      --text:#e8eef7;
      --muted:#9fb0c7;
      --accent:#7aa2ff;
      --accent2:#63d3ff;
      --border:rgba(255,255,255,.10);
      --shadow:0 14px 34px rgba(0,0,0,.40);
      --radius:20px;
    }

    body{
      font-family: Lato, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 700px at 15% 0%, rgba(122,162,255,.22), transparent 60%),
        radial-gradient(900px 600px at 90% 10%, rgba(99,211,255,.16), transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    #myNavbar{
      background: rgba(11,15,25,.75) !important;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    #myNavbar .navbar-nav{ margin: 0 auto; gap: .15rem; }
    #myNavbar .nav-link{
      color: rgba(232,238,247,.88) !important;
      font-weight: 800;
      letter-spacing: .3px;
      border-radius: 999px;
      padding: .45rem .85rem;
    }
    #myNavbar .nav-link:hover{ background: rgba(255,255,255,.06); }
    #myNavbar .nav-link.active{
      background: linear-gradient(135deg, rgba(122,162,255,.25), rgba(99,211,255,.18));
      border: 1px solid rgba(122,162,255,.22);
    }

    .hero-wrap{
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px 10px;
    }

    .hero-inner{
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
    }

    /* Photo */
    .avatar-wrap{
      margin-bottom: 28px;
    }
    .avatar-wrap img{
      width: 180px;
      height: 180px;
      object-fit: cover;
      object-position: center 20%; /* ← descend le cadrage vers le haut du visage */
      border-radius: 50%;
      border: 3px solid rgba(122,162,255,.40);
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }
        
    .avatar-placeholder{
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid rgba(122,162,255,.40);
      background: linear-gradient(135deg, rgba(122,162,255,.15), rgba(99,211,255,.10));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }
    .avatar-placeholder i{
      font-size: 60px;
      color: rgba(122,162,255,.50);
    }

    /* Name & Title */
    h1{
      margin: 0 0 8px;
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(30px, 4vw, 50px);
      letter-spacing: .2px;
    }

    .title-line{
      color: var(--accent);
      font-weight: 700;
      font-size: clamp(15px, 2vw, 19px);
      margin: 0 0 6px;
      letter-spacing: .3px;
    }

    .location-line{
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Description */
    .description{
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 20px 28px;
      margin-bottom: 28px;
      color: rgba(232,238,247,.80);
      font-size: 15px;
      line-height: 1.7;
    }

    /* Buttons */
    .btn-row{
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .btn-primary-custom{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(122,162,255,.30), rgba(99,211,255,.20));
      border: 1px solid rgba(122,162,255,.35);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: transform .15s ease, filter .15s ease;
    }
    .btn-primary-custom:hover{
      transform: translateY(-2px);
      filter: brightness(1.1);
      color: var(--text);
      text-decoration: none;
    }

    .btn-secondary-custom{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(232,238,247,.85);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }
    .btn-secondary-custom:hover{
      transform: translateY(-2px);
      background: rgba(255,255,255,.09);
      color: var(--text);
      text-decoration: none;
    }

    /* Skills pills */
    .skills-wrap{
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .skill-pill{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(122,162,255,.10);
      border: 1px solid rgba(122,162,255,.22);
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
    }
    .skill-pill i{ font-size: 13px; }

     /* Section */

    #portfolio{
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ====== PROJECT CARDS ====== */
    .project-card{
      position:relative;
      display:block;
      border-radius:var(--radius);
      overflow:hidden;
      background:rgba(255,255,255,.03);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      text-decoration:none;
      height:100%;
    }
    .project-card:hover{
      transform:translateY(-8px);
      border-color:rgba(122,162,255,.40);
      box-shadow:0 22px 54px rgba(0,0,0,.55);
    }

    .project-media{
      aspect-ratio:16/10;
      width:100%;
      position:relative;
      overflow:hidden;
      border-radius:inherit;
      background:transparent;
    }

    .tech-bg{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
      transform:scale(.98);
      transition:transform .45s ease, filter .45s ease, opacity .45s ease;
      opacity:.62;
      filter: blur(.25px);
      border-radius:inherit;
      background:
        radial-gradient(700px 380px at 30% 20%, rgba(122,162,255,.22), transparent 55%),
        radial-gradient(700px 380px at 80% 70%, rgba(99,211,255,.16), transparent 55%),
        linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    }
    .project-card:hover .tech-bg{
      transform:scale(1.01);
      opacity:.76;
      filter: blur(0px);
    }

    .tech-grid{
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:14px;
      padding:14px;
      align-content:space-between;
    }

    .tech-pill{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(11,15,25,.24);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(232,238,247,.84);
      backdrop-filter: blur(8px);
      font-size:12px;
      font-weight:650;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      box-shadow:none;
    }
    .tech-pill i{ font-size:14px; opacity:.9; }

    .bg-student{
      background:
        radial-gradient(700px 380px at 20% 15%, rgba(122,162,255,.25), transparent 55%),
        radial-gradient(700px 380px at 85% 80%, rgba(255,255,255,.10), transparent 55%),
        linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    }
    .bg-sim{
      background:
        radial-gradient(700px 380px at 30% 20%, rgba(99,211,255,.22), transparent 55%),
        radial-gradient(700px 380px at 85% 70%, rgba(122,162,255,.14), transparent 55%),
        linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    }
    .bg-web{
      background:
        radial-gradient(700px 380px at 30% 20%, rgba(122,162,255,.18), transparent 55%),
        radial-gradient(700px 380px at 85% 70%, rgba(99,211,255,.20), transparent 55%),
        linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    }
    .bg-devops{
      background:
        radial-gradient(700px 380px at 20% 20%, rgba(99,211,255,.20), transparent 55%),
        radial-gradient(700px 380px at 85% 70%, rgba(0,0,0,.15), transparent 55%),
        linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    }
    .bg-embedded{
      background:
        radial-gradient(700px 380px at 25% 25%, rgba(122,162,255,.22), transparent 55%),
        radial-gradient(700px 380px at 85% 70%, rgba(99,211,255,.12), transparent 55%),
        linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    }

    .project-caption{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
      background:transparent;
      pointer-events:none;
      border-radius:inherit;
    }
    .project-title{
      margin:0;
      padding:0;
      max-width:88%;
      font-size:22px;
      font-weight:900;
      letter-spacing:.35px;
      color:#ffffff;
      text-shadow:0 10px 30px rgba(0,0,0,.65);
      background:transparent;
      border:none;
      border-radius:0;
    }

    footer{
      text-align: center;
      font-size: 13px;
      color: rgba(232,238,247,.40);
      padding: 20px 0 16px;
    }
  </style>
</head>
